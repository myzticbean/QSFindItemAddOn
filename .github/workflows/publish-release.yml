# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Release

on:
#  push:
#    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of build to publish'
        required: true
        type: choice
        options:
          - snapshot
          - release
        default: snapshot

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.build_version.outputs.full_version }}
      version_type: ${{ steps.build_version.outputs.version_type }}
      game_version: ${{ steps.build_version.outputs.game_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject local-only maven-jar-plugin outputDirectory override
        run: |
          python3 - <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('pom.xml').getroot()
          for plugin in root.iter('{http://maven.apache.org/POM/4.0.0}plugin'):
              artifact_id = plugin.find('m:artifactId', ns)
              if artifact_id is None or artifact_id.text != 'maven-jar-plugin':
                  continue
              config = plugin.find('m:configuration', ns)
              output_dir = config.find('m:outputDirectory', ns) if config is not None else None
              if output_dir is not None:
                  print(f"::error::maven-jar-plugin has an active <outputDirectory> override ({output_dir.text}) in pom.xml. "
                        "This is a local-dev-only setting and must stay commented out in committed code.")
                  sys.exit(1)
          print("OK: no active outputDirectory override in maven-jar-plugin")
          PYEOF
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Compute build version
        id: build_version
        run: |
          base_version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          paper_api_version=$(mvn -q -Dexpression=paper-api.version -DforceStdout help:evaluate)
          game_version=$(echo "$paper_api_version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')

          if [[ "${{ inputs.release_type }}" == "snapshot" ]]; then
            case "${{ github.ref_name }}" in
              snapshot/*) ;;
              *)
                echo "release_type is 'snapshot' but the workflow was triggered from branch '${{ github.ref_name }}', not a snapshot/** branch" >&2
                exit 1
                ;;
            esac
            if [[ "$base_version" != *-SNAPSHOT ]]; then
              echo "release_type is 'snapshot' but pom.xml version ($base_version) has no -SNAPSHOT suffix" >&2
              exit 1
            fi
            full_version="${base_version}-${{ github.run_number }}"
            version_type="beta"
          else
            if [[ "$base_version" == *-SNAPSHOT ]]; then
              echo "release_type is 'release' but pom.xml version ($base_version) still has a -SNAPSHOT suffix" >&2
              exit 1
            fi
            full_version="$base_version"
            version_type="release"
          fi

          mvn versions:set -DnewVersion="$full_version" -DgenerateBackupPoms=false

          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "version_type=$version_type" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"
      - name: Extract changelog from CHANGELOG.md
        id: changelog
        run: |
          # Takes everything between the first "## " heading and the next one,
          # so CHANGELOG.md stays the single source of truth for release notes
          # (workflow_dispatch's text inputs are single-line and mangle pasted markdown).
          body=$(awk '
            /^## / { count++; next }
            count==1 { print }
            count==2 { exit }
          ' CHANGELOG.md | sed '/./,$!d')

          if [[ -z "${body// /}" ]]; then
            echo "Could not extract a changelog section from CHANGELOG.md" >&2
            exit 1
          fi

          delimiter="CHANGELOG_EOF_$RANDOM$RANDOM"
          echo "changelog<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSFindItemAddOn
          path: target/QSFindItemAddOn-*.jar

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: QSFindItemAddOn
          path: target
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.full_version }}
          name: ${{ needs.build.outputs.full_version }}
          body: ${{ needs.build.outputs.changelog }}
          files: target/QSFindItemAddOn-*.jar
          prerelease: ${{ needs.build.outputs.version_type == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  modrinth-publish:
    name: Publish to Modrinth
    needs: build
    runs-on: ubuntu-latest
    environment: MODRINTH
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: QSFindItemAddOn
          path: target
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: asp13ugE
          modrinth-token: ${{ secrets.MODRINTH_PAT }}
          files: target/QSFindItemAddOn-*.jar
          name: ${{ needs.build.outputs.full_version }}
          version: ${{ needs.build.outputs.full_version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: |
            folia
            paper
            purpur
          game-versions: |
            ${{ needs.build.outputs.game_version }}
