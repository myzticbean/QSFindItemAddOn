# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Release

on:
#  push:
#    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of build to publish'
        required: true
        type: choice
        options:
          - snapshot
          - release
        default: snapshot
      changelog:
        description: 'Changelog to publish to Modrinth for this version'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Setup Environment, Build JAR and Release Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compute build version
        id: build_version
        run: |
          base_version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          paper_api_version=$(mvn -q -Dexpression=paper-api.version -DforceStdout help:evaluate)
          game_version=$(echo "$paper_api_version" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')

          if [[ "${{ inputs.release_type }}" == "snapshot" ]]; then
            case "${{ github.ref_name }}" in
              snapshot/*) ;;
              *)
                echo "release_type is 'snapshot' but the workflow was triggered from branch '${{ github.ref_name }}', not a snapshot/** branch" >&2
                exit 1
                ;;
            esac
            if [[ "$base_version" != *-SNAPSHOT ]]; then
              echo "release_type is 'snapshot' but pom.xml version ($base_version) has no -SNAPSHOT suffix" >&2
              exit 1
            fi
            full_version="${base_version}-${{ github.run_number }}"
            version_type="beta"
          else
            if [[ "$base_version" == *-SNAPSHOT ]]; then
              echo "release_type is 'release' but pom.xml version ($base_version) still has a -SNAPSHOT suffix" >&2
              exit 1
            fi
            full_version="$base_version"
            version_type="release"
          fi

          mvn versions:set -DnewVersion="$full_version" -DgenerateBackupPoms=false

          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "version_type=$version_type" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSFindItemAddOn
          path: target/QSFindItemAddOn-*.jar
      - name: Automatic Release
        uses: Fulminazzo/java-automatic-release@v2
        with:
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          COMMIT_MESSAGE: ${{ inputs.changelog }}
      - name: Get Release Info and Rename
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_info=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          
          release_id=$(echo "$release_info" | jq -r .id)
          upload_url=$(echo "$release_info" | jq -r .upload_url)
          version=$(echo "$release_info" | jq -r .tag_name)
          
          # Extract full version from the release name (including RELEASE or SNAPSHOT)
          full_version=$(echo "$release_info" | jq -r .name | sed 's/.*[[:space:]]//')
          
          # Determine if it's a RELEASE or SNAPSHOT
          if [[ $full_version == *-SNAPSHOT ]]; then
            jar_suffix="-SNAPSHOT"
          else
            jar_suffix="-RELEASE"
          fi
          
          # Construct the full JAR name
          jar_name="QSFindItemAddOn-${full_version}${jar_suffix}.jar"
          
          # Update the release name to include RELEASE or SNAPSHOT
          curl -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$release_id" \
            -d "{\"name\":\"$full_version\"}"
          
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT
          echo "version=$full_version" >> $GITHUB_OUTPUT
          echo "jar_name=$jar_name" >> $GITHUB_OUTPUT

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./target/${{ steps.get_release.outputs.jar_name }}
          asset_name: ${{ steps.get_release.outputs.jar_name }}
          asset_content_type: application/java-archive
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: asp13ugE
          modrinth-token: ${{ secrets.MODRINTH_PAT }}
          files: target/QSFindItemAddOn-*.jar
          name: ${{ steps.build_version.outputs.full_version }}
          version: ${{ steps.build_version.outputs.full_version }}
          version-type: ${{ steps.build_version.outputs.version_type }}
          changelog: ${{ inputs.changelog }}
          loaders: |
            folia
            paper
            purpur
          game-versions: |
            ${{ steps.build_version.outputs.game_version }}
